services:

  postgres-vehiculos:
    image: postgres:16
    container_name: postgres-vehiculos
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: vehiculosdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_vehiculos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vehiculosdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - alquiler-net

  postgres-operaciones:
    image: postgres:16
    container_name: postgres-operaciones
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: operacionesdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_operaciones_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d operacionesdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - alquiler-net

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -node=consul-server -bootstrap-expect=1 -client=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - alquiler-net

  vehiculos-service:
    build:
      context: ./vehiculos-service
      dockerfile: Dockerfile
    container_name: vehiculos-service
    ports:
      - "8081:8081"
    environment:
      SERVICE_NAME: vehiculos-service
      SERVICE_HOST: vehiculos-service
      SERVICE_PORT: 8081
      DATABASE_URL: postgresql+psycopg://admin:admin123@postgres-vehiculos:5432/vehiculosdb
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      postgres-vehiculos:
        condition: service_healthy
      consul:
        condition: service_healthy
    networks:
      - alquiler-net

  operaciones-service:
    build:
      context: ./operaciones-service
      dockerfile: Dockerfile
    container_name: operaciones-service
    ports:
      - "8082:8082"
    environment:
      SERVICE_NAME: operaciones-service
      SERVICE_HOST: operaciones-service
      SERVICE_PORT: 8082
      DATABASE_URL: postgresql+psycopg://admin:admin123@postgres-operaciones:5432/operacionesdb
      VEHICULOS_SERVICE_URL: http://vehiculos-service:8081
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      postgres-operaciones:
        condition: service_healthy
      consul:
        condition: service_healthy
      vehiculos-service:
        condition: service_started
    networks:
      - alquiler-net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    depends_on:
      consul:
        condition: service_healthy
      vehiculos-service:
        condition: service_started
      operaciones-service:
        condition: service_started
    networks:
      - alquiler-net


volumes:
  postgres_vehiculos_data:
  postgres_operaciones_data:


networks:
  alquiler-net:
    driver: bridge